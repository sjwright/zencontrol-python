[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zencontrol-python"
dynamic = ["version"]
description = "Python implementation of the Zencontrol TPI Advanced protocol for DALI lighting controllers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Simon Wright"},
]
keywords = ["dali", "lighting", "control", "zencontrol", "home-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0",
    "ruff",
    "mypy>=0.950",
    "build>=1.0",
]
mqtt = [
    "aiomqtt>=2.1.0",
    "PyYAML>=6.0",
]
# Simulator integration tests (tests/test_sim_*.py) need zencontrol-simulator
# (pip install -e ../zencontrol-simulator, or a sibling ../zencontrol-simulator
# checkout) plus PyYAML.

[project.scripts]
zencontrol-mqtt = "examples.mqtt_bridge:main"

[project.urls]
Homepage = "https://github.com/sjwright/zencontrol-python"
Repository = "https://github.com/sjwright/zencontrol-python"
Issues = "https://github.com/sjwright/zencontrol-python/issues"

[tool.setuptools.dynamic]
version = {attr = "zencontrol.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["zencontrol*", "examples*"]

[tool.setuptools.package-data]
zencontrol = ["py.typed"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "simulator: integration tests that start zencontrol-simulator (installed or sibling ../zencontrol-simulator checkout)",
]

[tool.ruff]
target-version = "py314"
line-length = 130
exclude = ["examples"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "UP"]
ignore = [
    "ASYNC109", # Timeout parameters are part of the public async API.
    "COM812",   # Don't require trailing commas.
    "E501",     # Preserve existing protocol logging and payload formatting.
    "E701",     # Allow readable single-line conditionals.
]
