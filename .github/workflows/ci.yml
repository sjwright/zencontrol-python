name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out zencontrol-python
        uses: actions/checkout@v4
        with:
          path: zencontrol-python

      - name: Check out zencontrol-simulator
        uses: actions/checkout@v4
        with:
          repository: sjwright/zencontrol-simulator
          path: zencontrol-simulator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            zencontrol-python/pyproject.toml
            zencontrol-simulator/pyproject.toml

      - name: Install dependencies
        working-directory: zencontrol-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../zencontrol-simulator
          python -m pip install -e ".[dev]"

      - name: Ruff
        working-directory: zencontrol-python
        run: ruff check --output-format=github .

      - name: Mypy
        working-directory: zencontrol-python
        run: mypy zencontrol

      - name: Pytest
        working-directory: zencontrol-python
        run: pytest -q

      - name: Build package
        working-directory: zencontrol-python
        run: python -m build
